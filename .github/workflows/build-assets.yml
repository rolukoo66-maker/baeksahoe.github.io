name: Fetch Baeksahoe media

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download entry image
        shell: bash
        run: |
          URL="$(echo '' | base64 -d)"
          curl -L --fail --retry 3 "$URL" -o entry.png

      - name: Download new background audio
        shell: bash
        run: |
          URL="$(echo '' | base64 -d)"
          curl -L --fail --retry 3 "$URL" -o white-night-fragrance.mp4

      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entry.png white-night-fragrance.mp4
          if git diff --cached --quiet; then
            echo "No media changes"
          else
            git commit -m "Add Baeksahoe image and new background music"
            git push
          fi
